services:
  postgres:
    build:
      context: ./docker/postgres
    image: cortai-postgres:pg17
    environment:
      POSTGRES_DB: cortai
      POSTGRES_USER: cortai_app
      POSTGRES_PASSWORD: cortai_app
    ports:
      - "5432:5432"
    volumes:
      - cortai-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortai_app -d cortai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  cortai-postgres:
