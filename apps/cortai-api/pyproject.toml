[project]
name = "cortai-api"
version = "0.1.0"
description = "COrtai V1 modular monolith API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.3",
  "asyncpg>=0.29.0",
  "bcrypt>=4.2.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "greenlet>=3.1.1",
  "paho-mqtt>=2.1.0",
  "jsonschema>=4.23.0",
  "pydantic-settings>=2.5.2",
  "pyjwt[crypto]>=2.9.0",
  "python-multipart>=0.0.12",
  "redis>=5.0.8",
  "sqlalchemy[asyncio]>=2.0.35",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.30.6"
]

[dependency-groups]
dev = [
  "httpx>=0.27.2",
  "mypy>=1.11.2",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.9"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Reuse one event loop across tests to avoid asyncpg connection/pool
# objects being bound to a different loop between tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
pythonpath = ["."]
testpaths = ["tests"]
